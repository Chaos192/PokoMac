<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 0 280 58">
  <!-- SPDX-License-Identifier: GPL-3.0-or-later. The PokoMac wordmark: monoline letters (stroke centre lines on a 10/24/48 grid: cap
       height, x-height, baseline), a sunrise gradient over a dark outline so it reads on every launcher background. -->
  <defs>
    <linearGradient id="sun" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="264" y2="0">
      <stop offset="0" stop-color="#ffc35a"/>
      <stop offset=".35" stop-color="#ff6f61"/>
      <stop offset=".7" stop-color="#d4559a"/>
      <stop offset="1" stop-color="#8a72f0"/>
    </linearGradient>
    <g id="letters">
      <path d="M4 48V10h10a10.5 10.5 0 0 1 0 21H4"/>
      <path d="M39.5 36a12 12 0 1 0 24 0a12 12 0 1 0-24 0"/>
      <path d="M78.5 10v38M96 24 80.5 38M86 33l11 15"/>
      <path d="M112 36a12 12 0 1 0 24 0a12 12 0 1 0-24 0"/>
      <path d="M151 48V10l17 22 17-22v38"/>
      <path d="M200 36a12 12 0 1 0 24 0a12 12 0 1 0-24 0M224 24v24"/>
      <path d="M260.2 28.3A12 12 0 1 0 260.2 43.7"/>
    </g>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
