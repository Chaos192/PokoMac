[package]
name = "pokopia-launcher"
version = "0.1.1"
description = "PokoMac launcher"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zstd = "0.13"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }
# Report a problem (report.rs): the zip of logs; deflate only
zip = { version = "9", default-features = false, features = ["deflate"] }
# Link Play port forwarding (portmap.rs): UPnP IGD, blocking API
igd-next = { version = "0.18", default-features = false, features = ["io_sync"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_NetworkListManager", "Win32_Networking_WinSock", "Win32_System_Com"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
